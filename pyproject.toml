[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "pdf-agent-sdk"
version = "0.1.0"
description = "A lightweight PDF question-answering agent SDK with OpenAI and Azure OpenAI support."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
  { name = "PDF Agent SDK Contributors" }
]
dependencies = [
  "openai>=1.0.0",
  "pypdf>=4.0.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0"
]

[tool.hatch.build.targets.wheel]
packages = ["src/pdf_agent_sdk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
